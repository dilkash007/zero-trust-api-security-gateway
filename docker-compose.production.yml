version: "3.9"

# =============================================================================
# Zero-Trust API Security Engine — Production Docker Compose
#
# Services:
#   db       — PostgreSQL 15 (persistent volume)
#   redis    — Redis 7 (rate limiting & session cache)
#   backend  — FastAPI gateway (uvicorn, multi-worker)
#   frontend — React SOC dashboard (nginx)
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in secrets
#   docker compose -f docker-compose.production.yml up -d
# =============================================================================

services:

  # -------------------------------------------------------------------------
  # PostgreSQL 15
  # -------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-zero_trust_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zt_user} -d ${POSTGRES_DB:-zero_trust_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    # Postgres should NOT be exposed on the public internet
    expose:
      - "5432"

  # -------------------------------------------------------------------------
  # Redis 7 (rate limiting & ephemeral cache)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 100
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    expose:
      - "6379"

  # -------------------------------------------------------------------------
  # FastAPI Backend Gateway (multi-worker production mode)
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL and REDIS_URL to use Docker service names
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-zt_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zero_trust_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DEBUG: "false"
      POLICY_ENFORCEMENT_ACTIVE: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - backend_net
      - frontend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # -------------------------------------------------------------------------
  # React SOC Dashboard (nginx static serving)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend_net
    depends_on:
      - backend


# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
